name: Update CN fuel price snapshot

on:
  schedule:
    - cron: '0 22 * * *'   # 每日 06:00（香港時間 UTC+8）
  workflow_dispatch:        # 支援手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch 98# prices (qiyoujiage.com)
        run: python3 scripts/update_cn_price.py

      - name: Commit if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cn98.json
          if git diff --staged --quiet; then
            echo "no change; nothing to commit"
          else
            git commit -m "chore(data): 更新內地 98# 油價快照"
            git push
          fi
