name: Update CN fuel price snapshot

on:
  schedule:
    - cron: '0 22 * * *'   # 每日 06:00（香港時間 UTC+8）
  workflow_dispatch:        # 支援手動觸發

permissions:
  contents: write

# 避免定時與手動觸發同時執行而互相推擠
concurrency:
  group: update-cn-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch 98# prices (qiyoujiage.com)
        run: python3 scripts/update_cn_price.py

      - name: Commit if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cn98.json
          if git diff --staged --quiet; then
            echo "no change; nothing to commit"
            exit 0
          fi
          git commit -m "chore(data): 更新內地 98# 油價快照"
          # 期間若有人推送，先 rebase 再推，避免 non-fast-forward 失敗
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
